<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes OLIMPO - Suscripción</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --primary: #007bff;
            --primary-hover: #0056b3;
            --accent: #8b5cf6;
            --border: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .pricing-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
        }

        .pricing-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 300px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .pricing-card:hover {
            transform: translateY(-8px);
            border-color: #444;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
        }

        .pricing-card.featured {
            border: 2px solid var(--primary);
            transform: scale(1.05);
            z-index: 1;
        }

        .featured-label {
            background-color: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            text-transform: uppercase;
        }

        .plan-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .plan-price {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .plan-price span {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .plan-description {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .btn-pay {
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-pay:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="pricing-container">
        <div class="pricing-card">
            <div class="plan-name">Básico</div>
            <div class="plan-price">$19.990 <span>/mes</span></div>
            <div class="plan-description">Planificación de compras y control básico.</div>
            <a href="{{ url_basic }}" class="btn-pay">Pagar con MP</a>
        </div>

        <div class="pricing-card featured">
            <div class="featured-label">Recomendado</div>
            <div class="plan-name">Profesional</div>
            <div class="plan-price">$29.990 <span>/mes</span></div>
            <div class="plan-description">Gestión avanzada y soporte prioritario.</div>
            <a href="{{ url_pro }}" class="btn-pay">Pagar con MP</a>
        </div>

        <div class="pricing-card">
            <div class="plan-name">Enterprise</div>
            <div class="plan-price">$39.990 <span>/mes</span></div>
            <div class="plan-description">Solución integral de cadena de suministro.</div>
            <a href="{{ url_enterprise }}" class="btn-pay">Pagar con MP</a>
        </div>
    </div>
</body>
</html>
