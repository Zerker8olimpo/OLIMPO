<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login Google → OLIMPO</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <h2>Login Google → OLIMPO</h2>

  <!-- Inicialización Google -->
  <div
    id="g_id_onload"
    data-client_id="190198278868-bsrgcdd53fe6uc96m45jtfku940kjlp0.apps.googleusercontent.com"
    data-callback="handleCredentialResponse"
    data-auto_prompt="false">
  </div>

  <!-- Botón -->
  <div class="g_id_signin"></div>

  <script>
    function handleCredentialResponse(response) {
      console.log("=== GOOGLE ID TOKEN ===");
      console.log(response.credential);

      // Guarda token para pruebas
      window.google_id_token = response.credential;

      alert("Login OK. Revisa la consola (F12).");
    }
  </script>
</body>
</html>
